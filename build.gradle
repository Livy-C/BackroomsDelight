plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Modrinth hosts the Endless Backrooms and Farmer's Delight Refabricated artifacts.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

// Runtime dependencies are read from libs/ when the jars are present there, and otherwise
// resolved from the Modrinth maven repository. See libs/README.md.
def localLibs = file('libs')

def modDependency = { String fileName, String coordinates ->
	def localJar = new File(localLibs, fileName)

	if (localJar.isFile()) {
		return files(localJar)
	}

	return "maven.modrinth:${coordinates}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"endless_backrooms_delight" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Required dependencies of this mod. Both must also be declared in the "depends" block of
	// fabric.mod.json so that the loader refuses to start without them.
	// Endless Backrooms (https://modrinth.com/mod/endless_backrooms) - the dimension itself.
	modImplementation modDependency('endless_backrooms-0.4.3.jar', "endless_backrooms:${project.endless_backrooms_version}")
	// Farmer's Delight Refabricated (https://modrinth.com/mod/farmers-delight-refabricated) - the
	// Fabric port of Farmer's Delight. The official Farmer's Delight is Forge/NeoForge only.
	modImplementation modDependency('FarmersDelight-1.20.1-2.5.7+refabricated.jar', "farmers-delight-refabricated:${project.farmers_delight_version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

base {
	archivesName = project.archives_base_name
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
