plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

// Fabric Loom 1.17 needs a Java 21+ runtime. The build's *launcher* JVM is the one JAVA_HOME
// points at, so this block only helps the compile/test toolchains pick 21 when JAVA_HOME is an
// older JDK; it cannot rescue a Java 17 launcher, because the plugin classpath is resolved before
// any of this build script runs. See the "Development" section of README.md.
// If auto-detection does not find a JDK 21, set java21_home in gradle.properties.
def java21Home = providers.gradleProperty('java21_home').getOrElse('')

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)

		if (java21Home) {
			// Explicit override, e.g. java21_home=D:\\Java\\temurin-21
			def installation = new File(java21Home)
			def executables = [new File(installation, 'bin/java.exe'), new File(installation, 'bin/java')]
					.findAll { it.isFile() }

			if (executables.isEmpty()) {
				throw new GradleException("java21_home is set to '${java21Home}', but no bin/java was found there.")
			}

			installationPath = installation
		}
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Modrinth hosts the Endless Backrooms and Farmer's Delight Refabricated artifacts.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

// Runtime dependencies are read from libs/ when the jars are present there, and otherwise
// resolved from the Modrinth maven repository. See libs/README.md.
def localLibs = file('libs')

def modDependency = { String fileName, String coordinates ->
	def localJar = new File(localLibs, fileName)

	if (localJar.isFile()) {
		return files(localJar)
	}

	return "maven.modrinth:${coordinates}"
}

// Farmer's Delight Refabricated needs Porting Lib, and its own static initializer needs the recipe
// book category that Porting Lib's mixin adds. Porting Lib ships as an umbrella jar full of nested
// jars, and Loom does not load nested jars for modImplementation dependencies
// (FabricMC/fabric-loom#1275). In a development environment that leaves Porting Lib's mixins
// unapplied, so Farmer's Delight crashes on startup with
// "No enum constant RecipeBookType.FARMERSDELIGHT_COOKING".
//
// Production is unaffected: the real loader does unpack nested jars and applies the mixins.
//
// To make the development environment work, the nested modules are unpacked into libs/ and added
// here. Any jar dropped into libs/ is picked up, so no module list has to be maintained.
// See libs/README.md for how to produce them.
def unpackedModJars = fileTree(localLibs) {
	include '*.jar'
	exclude 'endless_backrooms-*.jar'
	exclude 'FarmersDelight-*.jar'
	exclude 'porting_lib-*.jar'
}

if (!unpackedModJars.isEmpty()) {
	logger.lifecycle("Adding ${unpackedModJars.files.size()} unpacked mod jar(s) from libs/ (Porting Lib workaround)")
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"endless_backrooms_delight" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Required dependencies of this mod. Both must also be declared in the "depends" block of
	// fabric.mod.json so that the loader refuses to start without them.
	// Endless Backrooms (https://modrinth.com/mod/endless_backrooms) - the dimension itself.
	modImplementation modDependency('endless_backrooms-0.4.3.jar', "endless_backrooms:${project.endless_backrooms_version}")
	// Farmer's Delight Refabricated (https://modrinth.com/mod/farmers-delight-refabricated) - the
	// Fabric port of Farmer's Delight. The official Farmer's Delight is Forge/NeoForge only.
	modImplementation modDependency('FarmersDelight-1.20.1-2.5.7+refabricated.jar', "farmers-delight-refabricated:${project.farmers_delight_version}")

	// Unpacked Porting Lib modules; runtime only, because nothing in this mod compiles against them.
	if (!unpackedModJars.isEmpty()) {
		modLocalRuntime files(unpackedModJars.files)
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

base {
	archivesName = project.archives_base_name
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
